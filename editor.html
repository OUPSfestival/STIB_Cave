<!DOCTYPE html>
<html>

<head>

<title>RCr 66 Editor</title>

<link rel="stylesheet" href="editor.css">

</head>


<body>

<header>
    <h1>RCr 66 Archive Editor</h1>
    <p>Biological · Geological · Symbiotic Database</p>
</header>


<main class="workspace">


<section class="articles-panel">

    <h2>Articles</h2>

    <input 
      class="search"
      placeholder="Search articles..."
    >

    <div id="articleList"></div>

</section>



<section class="editor-panel">


<h2>Edit Article</h2>


<label>
Title
</label>

<input id="editTitle" type="text">


<label>
Abstract
</label>

<textarea id="editAbstract"></textarea>


<label>
Description
</label>

<textarea id="editDescription"></textarea>


<label>
Image
</label>

<input 
id="editImage" 
type="file" 
accept="image/*"
>


<label>
Tags
</label>

<input 
id="editTags" 
type="text"
placeholder="plant, cave, biology"
>


<label>
Category
</label>

<input id="editCategory" type="text">


<label>
Credits
</label>

<input id="editCredits" type="text">



<div class="actions">

<button id="saveArticle">
SAVE ARTICLE
</button>


<button id="deleteArticle">
DELETE
</button>

</div>


</section>


</main>



<script src="articles.js"></script>
<script src="editor.js"></script>


</body>

</html>
