<main class="layout">


<aside class="article-list">

<h2>Existing Articles</h2>

<div id="articles-container">

<!-- Javascript will insert articles here -->

</div>


</aside>




<section class="editor-panel">


<h2>Article Information</h2>


<label>ID</label>
<input id="article-id" readonly>



<label>Title</label>
<input id="title">



<label>Category</label>
<input id="category">



<label>Summary</label>
<textarea id="excerpt"></textarea>



<label>Tags</label>

<div id="tags" class="tags"></div>




<h2>Publication</h2>


<label>Publishing Date</label>
<input id="date" type="date">



<label>Publishing Location</label>
<input id="location">



<label>Publisher</label>
<input id="publisher">





<h2>Object Description</h2>


<label>Infos</label>
<textarea id="body"></textarea>



<label>Object Material</label>
<input id="material">



<label>Object Technique</label>
<input id="technique">



<label>Sources</label>
<textarea id="sources"></textarea>





<h2>Media</h2>


<label>Image</label>

<input id="image">



<div class="image-preview">

<img id="preview">

</div>


<label>Credits</label>

<input id="credits">



<button class="save-button">
SAVE ARTICLE
</button>



</section>


</main>
