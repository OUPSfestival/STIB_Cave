<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OUPS Archive Editor</title>

<link rel="stylesheet" href="editor.css">

</head>


<body>


<header class="topbar">

    <div>
        <h1>OUPS Archive Editor</h1>
        <p>Documentation management system</p>
    </div>

    <div class="actions">
        <button class="secondary">New Article</button>
        <button class="primary">Save</button>
    </div>

</header>



<main>



<section>

<h2>Article Information</h2>


<label>Category</label>
<select>
<option>Select category</option>
<option>Exhibition</option>
<option>Performance</option>
<option>Artist</option>
<option>Publication</option>
<option>Documentation</option>
</select>



<label>Title</label>
<input type="text">



<label>Summary</label>
<textarea rows="4"></textarea>



<label>Tags</label>

<div class="tags">

<span>Performance ×</span>
<span>Video ×</span>

<button>+ Add tag</button>

</div>


</section>





<section>

<h2>Publication</h2>


<label>Publishing Date</label>
<input type="date">



<label>Publishing Location</label>
<input type="text">



<label>Publisher</label>
<input type="text">


</section>







<section>

<h2>Object Description</h2>


<label>Infos</label>
<textarea rows="5"></textarea>



<label>Object Material</label>
<input type="text">



<label>Object Technique</label>
<input type="text">



<label>Sources</label>
<textarea rows="5"></textarea>


</section>








<section>

<h2>Media</h2>



<label>Image</label>

<input type="file">



<div class="image-preview">

Image preview

</div>



<label>Image Information</label>

<textarea rows="3"></textarea>



<label>Image Credits</label>

<input type="text">


</section>





</main>



<footer>

<button class="save-button">
SAVE ARTICLE
</button>

</footer>



</body>

</html>
