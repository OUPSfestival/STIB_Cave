<!DOCTYPE html>
<html>

<head>

<title>RCr 66 Archive Editor</title>

<link rel="stylesheet" href="editor.css">

<link rel="icon" type="image/png" href="images/FAV-ed.png">

<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">

</head>


<body>


<header class="topbar">

<div>

<h1>RCr 66 Archive Editor</h1>

<p>Documentation management system</p>

</div>


</header>

  
  <main class="layout">


<aside class="article-list">

<h2>Existing Articles</h2>

<button id="new-article">
NEW ARTICLE
</button>


<div id="articles-container">

<!-- Javascript inserts articles here -->

</div>



<!-- KEEP THIS INSIDE ARTICLE-LIST -->

<div class="dialogue-panel">

<h2>
PUBLIC DIALOGUE
</h2>


<div id="editorComments">

Loading comments...

</div>


</div>


</aside>


<section class="editor-panel">


<section>

<h2>Teller</h2>


<label>Title</label>
<input id="title">


<label>Category</label>
<select id="category">
    <option value="">Select category...</option>
</select>


<label>Summary</label>
<textarea id="excerpt"></textarea>

<label>Content</label>
<div id="body"></div>


<label>Tags</label>

<div id="tagContainer" class="tag-container"></div>

<input id="newTagInput" type="text" placeholder="Add new tag">

<button type="button" id="addTagBtn">Add</button>


  
</section>



<section>


<label>Publishing Date</label>
<input id="publishing-date">


<label>Publishing Location</label>
<input id="publishing-location">


<label>Publisher</label>
<input id="publisher">


</section>



<section>


<label>Infos</label>
<textarea id="infos"></textarea>


<label>Object Material</label>
<input id="object-material">


<label>Object Technique</label>
<input id="object-technique">


<label>Sources</label>
<textarea id="sources"></textarea>


</section>




<section>

<label>Image</label>
<input id="image">

<div class="image-preview">

<img id="preview">

</div>



<label>Image Information</label>
<textarea id="image-info"></textarea>

  


<button class="save-button">
SAVE ARTICLE
</button>

<button id="delete-article" class="delete-button">
    XXX
</button>




</section>


</main>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
<script src="editor.js"></script>

</body>

</html>
