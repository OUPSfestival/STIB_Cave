<!DOCTYPE html>
<html>

<head>

<title>RCr 66 Archive Editor</title>

<link rel="stylesheet" href="editor.css">

<link rel="icon" type="image/png" href="images/FAV-ed.png">

</head>


<body>


<header class="topbar">

<div>

<h1>RCr 66 Archive Editor</h1>

<p>Documentation management system</p>

</div>


</header>

  
  <main class="layout">


<aside class="article-list">

<h2>Existing Articles</h2>

<button id="new-article">
NEW ARTICLE
</button>


<div id="articles-container">

<!-- Javascript inserts articles here -->

</div>



<!-- KEEP THIS INSIDE ARTICLE-LIST -->

<div class="dialogue-panel">

<h2>
PUBLIC DIALOGUE
</h2>


<div id="editorComments">

Loading comments...

</div>


</div>


</aside>


<section class="editor-panel">


<section>

<h2>Article Information</h2>


<label>Title</label>
<input id="title">


<label>Category</label>
<input id="category">


<label>Summary</label>
<textarea id="excerpt"></textarea>

<label>Content</label>
<textarea id="body"></textarea>


<label>Tags</label>

<div id="tagContainer" class="tag-container"></div>

<input id="newTagInput" type="text" placeholder="Add new tag">
<button type="button" id="addTagBtn">Add</button>

<!-- hidden field that gets sent to Supabase -->
<input type="hidden" id="tags">

</section>



<section>

<h2>Publication</h2>


<label>Publishing Date</label>
<input id="publishing-date">


<label>Publishing Location</label>
<input id="publishing-location">


<label>Publisher</label>
<input id="publisher">


</section>



<section>

<h2>Object Description</h2>


<label>Infos</label>
<textarea id="infos"></textarea>


<label>Object Material</label>
<input id="object-material">


<label>Object Technique</label>
<input id="object-technique">


<label>Sources</label>
<textarea id="sources"></textarea>


</section>




<section>

<h2>Media</h2>

<label>Image</label>
<input id="image">

<div class="image-preview">

<img id="preview">

</div>



<label>Image Information</label>
<textarea id="image-info"></textarea>

  


<button class="save-button">
SAVE ARTICLE
</button>




</section>


<!-- PUBLIC DIALOGUE -->

<section class="dialogue-panel">

<h2>
PUBLIC DIALOGUE
</h2>


<div id="editorComments">

Loading comments...

</div>


</section>


</section>


</main>


</section>


  
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="editor.js"></script>

</body>

</html>
