<!DOCTYPE html>
<html>

<head>

<title>RCr 66 Editor</title>

<link rel="stylesheet" href="editor.css">

</head>


<body>


<h1>RCr 66 Editor</h1>


<section class="editor">


<div class="editor-box">

  <label>
    Title
  </label>
  <input id="editTitle" type="text">


  <label>
    Abstract
  </label>
  <textarea id="editAbstract"></textarea>


  <label>
    Description
  </label>
  <textarea id="editDescription"></textarea>


  <label>
    Image
  </label>
  <input id="editImage" type="file" accept="image/*">


  <label>
    Tags
  </label>
  <input id="editTags" type="text" placeholder="plant, cave, biology">


  <label>
    Category
  </label>
  <input id="editCategory" type="text">


  <label>
    Credits
  </label>
  <input id="editCredits" type="text">


  <button id="saveArticle">
    Save Article
  </button>

</div>

</section>



<h2>Articles</h2>


<div id="articleList"></div>



<script src="articles.js"></script>
<script src="editor.js"></script>


</body>

</html>
