<!DOCTYPE html>
<html>

<head>

<title>RCr 66 Archive Editor</title>

<link rel="stylesheet" href="editor.css">

<link rel="icon" type="image/png" href="images/FAV-ed.png">

</head>


<body>


<header class="topbar">

<div>

<h1>RCr 66 Archive Editor</h1>

<p>Documentation management system</p>

</div>


</header>

  
  <main class="layout">


<aside class="article-list">

<h2>Existing Articles</h2>

<button id="new-article">
NEW ARTICLE
</button>

<div id="articles-container">

<!-- Javascript will insert articles here -->

</div>


</aside>




<section class="editor-panel">


<section>

<h2>Article Information</h2>


<label>Title</label>
<input id="title">


<label>Category</label>
<input id="category">


<label>Summary</label>
<textarea id="excerpt"></textarea>

<label>Content</label>
<textarea id="body"></textarea>


<label>Tags</label>
<div id="tags" class="tags"></div>

</section>



<section>

<h2>Publication</h2>


<label>Publishing Date</label>
<input id="publishing-date">


<label>Publishing Location</label>
<input id="publishing-location">


<label>Publisher</label>
<input id="publisher">


</section>



<section>

<h2>Object Description</h2>


<label>Infos</label>
<textarea id="infos"></textarea>


<label>Object Material</label>
<input id="object-material">


<label>Object Technique</label>
<input id="object-technique">


<label>Sources</label>
<textarea id="sources"></textarea>


</section>




<section>

<h2>Media</h2>

<label>Image</label>
<input id="image">

<label>Credits</label>
<input id="credits">

<div class="image-preview">

<img id="preview">

</div>



<label>Image Information</label>
<textarea id="image-info"></textarea>

  


<button class="save-button">
SAVE ARTICLE
</button>


</section>



</section>


</main>



<script src="editor.js" defer></script>

</body>

</html>
