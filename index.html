<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RCr 66 // Collective Research Archive</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="archiveLayout" class="archive-layout">

  <!-- INTRO -->

  <aside class="intro-panel">

    <h1>RCr 66</h1>

    <p class="subtitle">
      Ssymnac Cave Complex
    </p>

    <p class="author">
      Manuel Phil. Bischof
    </p>

    <input
      type="text"
      id="searchInput"
      placeholder="Search archive..."
    >

  </aside>

  <!-- COLUMN 1 -->

  <section class="archive-column">

    <div class="column-header">

      <select class="tag-select">
        <option value="">Random</option>
      </select>

    </div>

    <div id="column1" class="column-content"></div>

  </section>

  <!-- COLUMN 2 -->

  <section class="archive-column">

    <div class="column-header">

      <select class="tag-select">
        <option value="">Random</option>
      </select>

    </div>

    <div id="column2" class="column-content"></div>

  </section>

  <!-- COLUMN 3 -->

  <section class="archive-column">

    <div class="column-header">

      <select class="tag-select">
        <option value="">Random</option>
      </select>

    </div>

    <div id="column3" class="column-content"></div>

  </section>

  <!-- CASE FILES -->

  <aside class="case-panel">

    <h3>Case Files</h3>

    <div class="case-item">
      CF.01
    </div>

    <div class="case-item">
      CF.02
    </div>

    <div class="case-item">
      CF.03
    </div>

  </aside>

</div>


<!-- ARTICLE VIEW -->

<div id="articleView" class="article-view hidden">

  <aside class="intro-panel">

    <button id="backButton">
      ← Archive
    </button>

  </aside>

  <section class="article-image">

    <img id="articleImage">

    <div id="articleCredits"></div>

  </section>

  <section class="article-content">

    <small id="articleCategory"></small>

    <h2 id="articleTitle"></h2>

    <div id="articleBody"></div>

  </section>

</div>

<script src="articles.js"></script>
<script src="script.js"></script>

</body>
</html>
