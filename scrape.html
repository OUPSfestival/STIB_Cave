<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAVE Archive scrape</title>

<link rel="stylesheet" href="cms.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            <h1>CAVE</h1>
            <p>Archive CMS</p>

        </div>

        <input
            id="search"
            placeholder="Search..."
        >

        <button id="newArticle">
            + New Article
        </button>

        <div id="articleList"></div>

    </aside>



    <main class="editor">

        <div class="toolbar">

            <button id="save">
                Save
            </button>

            <button id="delete">
                Delete
            </button>

        </div>


        <input
            id="title"
            class="title"
            placeholder="Article title..."
        >

        <input
            id="category"
            placeholder="Category"
        >

        <input
            id="tags"
            placeholder="Tags"
        >

        <input
            id="credits"
            placeholder="Credits"
        >


        <textarea
            id="excerpt"
            placeholder="Abstract..."
        ></textarea>


        <textarea
            id="content"
            class="content"
            placeholder="Write your article..."
        ></textarea>

    </main>

</div>

<script src="cms.js"></script>

</body>

</html>
